# herdr configuration
# Managed by GNU Stow from this repository.
#
# This ports the tmux preferences from stow/tmux/.tmux.conf where Herdr has
# equivalent configuration. Some tmux-specific features, such as status-line
# format strings, TPM plugins, terminal-overrides, and detailed copy-mode key
# tables, do not have direct Herdr equivalents.

onboarding = false

[theme]
# Use a polished dark UI with enough contrast for long-running agent sessions.
name = "gruvbox"

[theme.custom]
# Muted, high-contrast accents inspired by Kanagawa's ink and autumn palette.
panel_bg = "reset"
accent = "#dca561"
green = "#98bb6c"
blue = "#7e9cd8"
yellow = "#e6c384"
red = "#e46876"

[terminal]
# tmux used $SHELL for default-shell/default-command. Leaving this empty lets
# Herdr use $SHELL, then /bin/sh.
default_shell = ""

# On macOS this starts login shells, preserving PATH setup from path_helper and
# Homebrew initialization.
shell_mode = "auto"

# Match tmux's practical behavior: new panes/tabs start from the current pane or
# workspace directory when possible.
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
# tmux prefix was changed from C-b to C-k.
prefix = "ctrl+k"

# tmux: prefix+r reloads the config.
reload_config = "prefix+r"

# tmux-style detach and common navigation.
detach = "prefix+d"
workspace_picker = "prefix+w"
goto = "prefix+g"

# tmux windows are closest to Herdr tabs. Keep tab numbers 1..9.
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+ctrl+h"
next_tab = "prefix+ctrl+l"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# Vim-like pane focus, matching prefix+h/j/k/l in tmux.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# tmux used direct C-o to cycle panes.
cycle_pane_next = ["prefix+tab", "ctrl+o"]
cycle_pane_previous = "prefix+shift+tab"

# tmux used prefix+v for copy-mode. Herdr's copy mode already uses vi-like
# h/j/k/l, w/b/e, v, y, Enter, q, and Esc internally.
copy_mode = "prefix+v"

# tmux used prefix+- for split down. Herdr's documented split-right default is
# prefix+v, but that conflicts with the tmux copy-mode binding above.
split_horizontal = "prefix+minus"
split_vertical = "prefix+shift+v"

close_pane = "prefix+x"
zoom = "prefix+z"

# Herdr exposes resize as a mode rather than direct prefix+H/J/K/L bindings.
resize_mode = "prefix+shift+r"

toggle_sidebar = "prefix+b"

# Navigate-mode keeps plain vim keys, mirroring tmux pane movement habits.
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"
navigate_workspace_up = "up"
navigate_workspace_down = "down"

# Avoid stealing Ctrl-v in remote sessions; tmux only used C-v inside copy mode.
remote_image_paste = ""

[ui]
# tmux had mouse support enabled.
mouse_capture = true
mouse_scroll_lines = 3

# Give split panes a little breathing room so the layout reads cleaner.
pane_borders = true
pane_gaps = true

confirm_close = true
prompt_new_tab_name = false
redraw_on_focus_gained = true

sidebar_width = 34
sidebar_min_width = 18
sidebar_max_width = 42
mobile_width_threshold = 64

show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
accent = "#dca561"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
allow_nested = false
kitty_graphics = false
pane_history = false

# Helpful on macOS when using Japanese input methods with agent TUIs.
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "opencode", "cursor", "kimi", "droid", "amp"]
cjk_ime_cursor_shape = "steady_block"

[advanced]
# tmux used history-limit 100000 lines. Herdr config is byte-based, so this is
# a deliberately larger approximation for long-running panes.
scrollback_limit_bytes = 100000000
